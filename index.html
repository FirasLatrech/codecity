<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CodeCity</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font: 13px/1.45 ui-monospace, monospace; }
  #brand { position: fixed; top: 14px; left: 16px; z-index: 2; color: #e6edf3; user-select: none; transition: opacity 1.2s; }
  #brand h1 { font-size: 15px; margin: 0; letter-spacing: .1em; }
  #brand span { font-size: 11px; color: #56637a; }
  #brand.dim { opacity: .3; }
  .fab { position: fixed; right: 16px; z-index: 2; width: 42px; height: 42px; border-radius: 50%;
         background: rgba(14,19,27,.75); border: 1px solid #2d3644; backdrop-filter: blur(8px);
         font-size: 18px; cursor: pointer; display: grid; place-items: center; }
  #modeBtn { top: 14px; } #sndBtn { top: 64px; }
  #card { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px); z-index: 2;
          display: flex; align-items: center; gap: 13px; max-width: min(760px, 92vw);
          background: rgba(11,15,22,.82); border: 1px solid #2d3644; border-radius: 16px;
          padding: 11px 17px; backdrop-filter: blur(12px);
          opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #card.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #card .faces { display: flex; }
  #card .faces img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #2d3644; background: #0e131b; }
  #card .faces img + img { margin-left: -12px; }
  #card .path { color: #56637a; word-break: break-all; }
  #card .path b { color: #7ee0a3; }
  #card .meta { color: #8b98a9; font-size: 12px; margin-top: 2px; }
  #card .meta em { color: #cdd6e0; font-style: normal; }
  #viewer { position: fixed; inset: 5% 8%; z-index: 5; display: none; flex-direction: column;
            background: rgba(9,12,18,.97); border: 1px solid #2d3644; border-radius: 14px; overflow: hidden; }
  #vhead { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 12px 18px; border-bottom: 1px solid #1d2530; color: #7ee0a3; }
  #vhead button { background: none; border: none; color: #8b98a9; font: inherit; font-size: 16px; cursor: pointer; }
  #vbody { margin: 0; padding: 16px 20px; overflow: auto; flex: 1; color: #cdd6e0; font-size: 12px;
           line-height: 1.55; tab-size: 4; white-space: pre; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #e6edf3; text-align: center; z-index: 6; }
</style>
</head>
<body>
<div id="brand"><h1>CODECITY</h1><span id="repoline"></span></div>
<button class="fab" id="modeBtn" title="switch mode (C)">🚗</button>
<button class="fab" id="sndBtn" title="sound (M)">🔊</button>
<div id="card"><div class="faces"></div><div><div class="path"></div><div class="meta"></div></div></div>
<div id="viewer"><div id="vhead"><span id="vpath"></span><button id="vclose">✕</button></div><pre id="vbody"></pre></div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { gsap } from 'gsap';

let city;
try { city = await (await fetch('./city.json')).json(); }
catch {
  const e = document.getElementById('err');
  e.style.display = 'grid';
  e.innerHTML = '<div>no <b>city.json</b> yet.<br><br>run:&nbsp; <code>node analyze.mjs /path/to/repo</code><br>then <code>node server.mjs</code></div>';
  throw new Error('no city.json');
}
const q = new URLSearchParams(location.search);

const PALETTE = {
  '.js': 0xf1c40f, '.mjs': 0xf1c40f, '.cjs': 0xf1c40f, '.ts': 0x3178c6, '.jsx': 0x61dafb, '.tsx': 0x61dafb,
  '.css': 0x2965f1, '.scss': 0xcd6799, '.html': 0xe34f26, '.json': 0x6fbf73, '.md': 0x8b98a9,
  '.py': 0x4b8bbe, '.rs': 0xdea584, '.go': 0x00add8, '.java': 0xb07219, '.rb': 0xcc342d,
  '.c': 0x9db4c0, '.h': 0x9db4c0, '.cpp': 0xf34b7d, '.php': 0x777bb3, '.swift': 0xf05138,
  '.dart': 0x00b4ab, '.vue': 0x41b883, '.svelte': 0xff3e00, '.yml': 0xcb6c4d, '.yaml': 0xcb6c4d,
};
const hashCode = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const extColor = ext => new THREE.Color(PALETTE[ext] ??
  new THREE.Color().setHSL((hashCode(ext || '?') % 20) / 20, .45, .55).getHex());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0016);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(420, 320, 420);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8fb8de, 0x10141c, 0.95));
const sun = new THREE.DirectionalLight(0xfff2d9, 1.6);
sun.position.set(120, 180, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 150, bottom: -150, far: 500 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: 0x0e1219, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const box = new THREE.BoxGeometry(1, 1, 1);
const roundedBox = new RoundedBoxGeometry(1, 1, 1, 3, 0.07);
const m = new THREE.Matrix4();
const depthOf = p => p.split('/').length - 1;
const baseY = b => 0.12 + depthOf(b.path) * 0.1;

const plates = new THREE.InstancedMesh(box,
  new THREE.MeshStandardMaterial({ roughness: 0.95 }), city.districts.length);
city.districts.forEach((d, i) => {
  const y = 0.12 + d.depth * 0.1;
  m.compose(new THREE.Vector3(d.x + d.w / 2, y / 2, d.z + d.d / 2), new THREE.Quaternion(), new THREE.Vector3(d.w, y, d.d));
  plates.setMatrixAt(i, m);
  plates.setColorAt(i, new THREE.Color().setHSL(0.6, 0.15, 0.09 + Math.min(d.depth, 6) * 0.02));
});
plates.receiveShadow = true;
scene.add(plates);

function groundY(x, z) {
  let top = 0;
  for (const d of city.districts)
    if (x >= d.x && x <= d.x + d.w && z >= d.z && z <= d.z + d.d) top = Math.max(top, 0.12 + d.depth * 0.1);
  return top;
}

// ---------- street names + the entrance ----------
function textPlane(text, maxW, color = 'rgba(230,237,243,.5)') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  let size = 68;
  g.font = `700 ${size}px ui-monospace, monospace`;
  while (g.measureText(text).width > 480 && size > 18) { size -= 4; g.font = `700 ${size}px ui-monospace, monospace`; }
  g.fillStyle = color;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 66);
  const t = new THREE.CanvasTexture(c);
  const w = Math.min(maxW, Math.max(6, text.length * 1.1));
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  p.rotation.x = -Math.PI / 2;
  return p;
}
for (const d of city.districts) {
  if (d.depth === 0 || d.depth > 2 || d.w < 7) continue;
  if (d.depth === 2 && d.w * d.d < 500) continue;
  const label = textPlane(d.name.split('/').at(-1), d.w * 0.85);
  label.position.set(d.x + d.w / 2, 0.13 + d.depth * 0.1, d.z + d.d - label.geometry.parameters.height / 2 - 0.6);
  scene.add(label);
}
// entrance road with center dashes, leading into the city
{
  const c = document.createElement('canvas');
  c.width = 128; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(42,50,64,.5)'; g.fillRect(0, 0, 128, 1024);
  g.fillStyle = 'rgba(230,237,243,.4)';
  for (let y = 10; y < 1024; y += 74) g.fillRect(60, y, 8, 40);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(7, 44),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.015, 122);
  scene.add(road);

  const title = textPlane(city.name.toUpperCase(), 34, 'rgba(230,237,243,.85)');
  title.position.set(0, 0.03, 103);
  scene.add(title);
  const hint = textPlane('WASD · ZQSD · ARROWS — SHIFT boost · E read file · C sky', 30, 'rgba(230,237,243,.7)');
  hint.position.set(0, 0.03, 131);
  scene.add(hint);
}

// ---------- buildings: one clean mesh + tiny rooftop lamps on hot files ----------
const sortedCommits = city.buildings.map(b => b.commits || 0).sort((a, b) => a - b);
const HOT = Math.max(3, sortedCommits[Math.floor(sortedCommits.length * 0.9)] || 0);
const hotB = city.buildings.filter(b => (b.commits || 0) >= HOT);

const buildingsMesh = new THREE.InstancedMesh(roundedBox,
  new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0.12 }), city.buildings.length);
city.buildings.forEach((b, i) => {
  m.compose(new THREE.Vector3(b.x, baseY(b) + b.h / 2, b.z), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, b.d));
  buildingsMesh.setMatrixAt(i, m);
  buildingsMesh.setColorAt(i, extColor(b.ext));
  b._i = i;
});
buildingsMesh.castShadow = buildingsMesh.receiveShadow = true;
scene.add(buildingsMesh);

const beaconMat = new THREE.MeshStandardMaterial({ color: 0x281c0c, emissive: 0xffb45e, emissiveIntensity: 2.6 });
const beacons = new THREE.InstancedMesh(box, beaconMat, hotB.length);
hotB.forEach((b, i) => {
  const s = Math.min(0.55, Math.max(0.3, Math.min(b.w, b.d) * 0.25));
  m.compose(new THREE.Vector3(b.x, baseY(b) + b.h + s / 2 + 0.02, b.z), new THREE.Quaternion(), new THREE.Vector3(s, s * 0.7, s));
  beacons.setMatrixAt(i, m);
});
scene.add(beacons);

// trees on the outskirts
{
  const N = 140;
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.25, .38, 1.6, 6),
    new THREE.MeshStandardMaterial({ color: 0x6b4a33, roughness: 1 }), N);
  const leaf = new THREE.InstancedMesh(new THREE.ConeGeometry(1.7, 3.6, 7),
    new THREE.MeshStandardMaterial({ roughness: 1 }), N);
  for (let i = 0; i < N; i++) {
    const r = 155 + Math.random() * 120, a = Math.random() * Math.PI * 2, s = 0.7 + Math.random();
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(x) < 12 && z > 95) continue; // keep the entrance road clear
    m.compose(new THREE.Vector3(x, 0.8 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s));
    trunk.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(x, 3.4 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s));
    leaf.setMatrixAt(i, m);
    leaf.setColorAt(i, new THREE.Color().setHSL(0.36 + Math.random() * 0.06, 0.5, 0.22 + Math.random() * 0.12));
  }
  scene.add(trunk, leaf);
}

// ---------- faces with name tags; gravatar photo swaps in when it exists ----------
const faceCache = new Map();
function face(name, ghash) {
  if (faceCache.has(name)) return faceCache.get(name);
  const c = document.createElement('canvas');
  c.width = 128; c.height = 176;
  const g = c.getContext('2d');
  const drawAll = img => {
    g.clearRect(0, 0, 128, 176);
    g.save();
    g.beginPath(); g.arc(64, 64, 58, 0, 7); g.clip();
    if (img) g.drawImage(img, 0, 0, 128, 128);
    else {
      g.fillStyle = `hsl(${hashCode(name) % 360} 55% 62%)`; g.fillRect(0, 0, 128, 128);
      g.fillStyle = '#20242c';
      g.beginPath(); g.arc(44, 56, 6.5, 0, 7); g.arc(84, 56, 6.5, 0, 7); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(46, 54, 2.2, 0, 7); g.arc(86, 54, 2.2, 0, 7); g.fill();
      g.strokeStyle = '#20242c'; g.lineWidth = 5; g.lineCap = 'round';
      g.beginPath(); g.arc(64, 74, 17, Math.PI * 0.18, Math.PI * 0.82); g.stroke();
      g.fillStyle = 'rgba(255,120,120,.35)';
      g.beginPath(); g.arc(34, 74, 8, 0, 7); g.arc(94, 74, 8, 0, 7); g.fill();
    }
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 5;
    g.beginPath(); g.arc(64, 64, 58, 0, 7); g.stroke();
    const label = name.length > 14 ? name.slice(0, 13) + '…' : name;
    g.font = '700 19px ui-monospace, monospace';
    const pw = Math.min(124, g.measureText(label).width + 20);
    g.fillStyle = 'rgba(10,14,20,.9)';
    g.beginPath(); g.roundRect((128 - pw) / 2, 136, pw, 30, 9); g.fill();
    g.fillStyle = '#e6edf3'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, 64, 152);
  };
  drawAll(null);
  const tex = new THREE.CanvasTexture(c);
  const entry = { tex, url: c.toDataURL() };
  if (ghash) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { drawAll(img); tex.needsUpdate = true; entry.url = c.toDataURL(); };
    img.src = `https://www.gravatar.com/avatar/${ghash}?s=128&d=404`;
  }
  faceCache.set(name, entry);
  return entry;
}
const faceSprite = (name, ghash, h) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: face(name, ghash).tex, transparent: true }));
  s.scale.set(h * 0.727, h, 1); // canvas is 128x176
  return s;
};

// the whole team greets you at the gate
const contrib = {};
for (const b of city.buildings) for (const [n, c, h] of b.authors ?? []) { const e = contrib[n] ??= { n: 0, h }; e.n += c; }
const team = Object.entries(contrib).sort((a, b) => b[1].n - a[1].n).slice(0, 4);
const gate = [];
team.forEach(([name, { h }], i) => {
  const s = faceSprite(name, h, 9);
  s.position.set((i - (team.length - 1) / 2) * 11, 5.6, 108);
  scene.add(s);
  gate.push({ s, y0: 5.6, ph: i * 1.3 });
});
// and the top authors float over the 12 hottest buildings
const residents = [];
[...city.buildings].filter(b => b.authors?.length)
  .sort((a, b) => (b.commits || 0) - (a.commits || 0)).slice(0, 12)
  .forEach((b, i) => {
    const s = faceSprite(b.authors[0][0], b.authors[0][2], 5.5);
    scene.add(s);
    residents.push({ s, b, ph: i * 1.7 });
  });
const inspectFace = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true }));
inspectFace.scale.set(4 * 0.727, 4, 1);
inspectFace.visible = false;
scene.add(inspectFace);

// ---------- the car ----------
const car = { pos: new THREE.Vector3(0, 0, 138), heading: Math.PI, speed: 0, steer: 0 };
const carGroup = new THREE.Group();
const wheels = [];
{
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .5, metalness: .1 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.8, .55, 3.2, 3, .12), mat(0xd7443e));
  body.position.y = .62;
  const nose = new THREE.Mesh(new RoundedBoxGeometry(1.6, .3, .8, 3, .1), mat(0xd7443e));
  nose.position.set(0, .5, 1.9);
  const cabin = new THREE.Mesh(new RoundedBoxGeometry(1.5, .5, 1.5, 3, .12), mat(0xe8e6df));
  cabin.position.set(0, 1.1, -.25);
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff6d5, emissive: 0xffedb0, emissiveIntensity: 3 });
  const lampL = new THREE.Mesh(new THREE.BoxGeometry(.28, .16, .1), lightMat); lampL.position.set(-.55, .62, 2.3);
  const lampR = lampL.clone(); lampR.position.x = .55;
  const glow = new THREE.PointLight(0xffddaa, 40, 30, 2); glow.position.set(0, .9, 2.4);
  const wheelGeo = new THREE.CylinderGeometry(.38, .38, .32, 12); wheelGeo.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-.85, 1.05], [.85, 1.05], [-.85, -1.1], [.85, -1.1]]) {
    const w = new THREE.Mesh(wheelGeo, mat(0x14171e));
    w.position.set(x, .38, z);
    wheels.push(w); carGroup.add(w);
  }
  for (const p of [body, nose, cabin]) p.castShadow = true;
  carGroup.add(body, nose, cabin, lampL, lampR, glow);
  scene.add(carGroup);
}

const R = 1.2;
const blocked = (x, z) => {
  if (Math.abs(x) > 285 || Math.abs(z) > 285) return true;
  for (const b of city.buildings)
    if (Math.abs(x - b.x) < b.w / 2 + R && Math.abs(z - b.z) < b.d / 2 + R) return true;
  return false;
};

// ---------- sound: everything synthesized, no audio files ----------
const audio = { ctx: null, muted: false };
function initAudio() {
  if (audio.ctx || audio.muted) return;
  const ctx = audio.ctx = new AudioContext();
  const master = audio.master = ctx.createGain();
  master.gain.value = 1;
  master.connect(ctx.destination);
  const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 46;
  const osc2 = ctx.createOscillator(); osc2.type = 'square'; osc2.frequency.value = 92;
  const g2 = ctx.createGain(); g2.gain.value = 0.3;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const eg = audio.engineGain = ctx.createGain(); eg.gain.value = 0;
  osc.connect(lp); osc2.connect(g2); g2.connect(lp); lp.connect(eg); eg.connect(master);
  osc.start(); osc2.start();
  audio.osc = osc; audio.osc2 = osc2;
  const len = ctx.sampleRate * 0.2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  audio.noise = buf;
}
addEventListener('pointerdown', initAudio);
let lastThump = 0;
function thump(v) {
  if (!audio.ctx || audio.muted || t - lastThump < 0.15) return;
  lastThump = t;
  const ctx = audio.ctx, s = ctx.createBufferSource();
  s.buffer = audio.noise;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
  const g = ctx.createGain(); g.gain.value = Math.min(0.4, 0.05 + v * 0.012);
  s.connect(lp); lp.connect(g); g.connect(audio.master);
  s.start();
}
let lastChime = 0;
function chime() {
  if (!audio.ctx || audio.muted || t - lastChime < 0.3) return;
  lastChime = t;
  const ctx = audio.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(740, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1170, ctx.currentTime + 0.09);
  g.gain.setValueAtTime(0.03, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
  o.connect(g); g.connect(audio.master);
  o.start(); o.stop(ctx.currentTime + 0.25);
}
const sndBtn = document.getElementById('sndBtn');
function toggleSnd() {
  audio.muted = !audio.muted;
  sndBtn.textContent = audio.muted ? '🔇' : '🔊';
  if (audio.master) audio.master.gain.value = audio.muted ? 0 : 1;
  if (!audio.muted) initAudio();
}
sndBtn.onclick = toggleSnd;

// ---------- driving ----------
const keys = {};
const KEY = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r', ShiftLeft: 'boost', ShiftRight: 'boost' };
addEventListener('keydown', e => {
  initAudio();
  if (viewerOpen) {
    if (e.code === 'Escape' || e.code === 'KeyE') closeViewer();
    return;
  }
  if (e.code === 'KeyC') setMode(mode === 'drive' ? 'orbit' : 'drive');
  if (e.code === 'KeyM') toggleSnd();
  if (e.code === 'KeyE' && cur) openFile(cur);
  if (KEY[e.code]) { keys[KEY[e.code]] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (KEY[e.code]) keys[KEY[e.code]] = false; });

function driveStep(dt) {
  const accel = (keys.f ? 26 : 0) - (keys.b ? 20 : 0);
  car.speed += accel * (keys.boost ? 1.9 : 1) * dt;
  car.speed -= car.speed * 1.6 * dt;
  if (!accel && Math.abs(car.speed) < 0.15) car.speed = 0;
  car.speed = Math.max(-14, Math.min(keys.boost ? 55 : 34, car.speed));
  const steerIn = (keys.l ? 1 : 0) - (keys.r ? 1 : 0);
  car.steer += (steerIn * 0.42 - car.steer) * Math.min(1, dt * 8);
  car.heading += car.steer * 4.4 * dt * Math.min(1, Math.abs(car.speed) / 10) * Math.sign(car.speed);

  const dir = new THREE.Vector3(Math.sin(car.heading), 0, Math.cos(car.heading));
  const nx = car.pos.x + dir.x * car.speed * dt, nz = car.pos.z + dir.z * car.speed * dt;
  if (!blocked(nx, nz)) { car.pos.x = nx; car.pos.z = nz; }
  else if (!blocked(nx, car.pos.z)) { car.pos.x = nx; car.speed *= 0.7; }
  else if (!blocked(car.pos.x, nz)) { car.pos.z = nz; car.speed *= 0.7; }
  else { thump(Math.abs(car.speed)); car.speed *= -0.25; }

  car.pos.y += (groundY(car.pos.x, car.pos.z) - car.pos.y) * Math.min(1, dt * 10);
  carGroup.position.copy(car.pos);
  carGroup.rotation.y = car.heading;
  for (let i = 0; i < 4; i++) {
    wheels[i].rotation.x += car.speed * dt / 0.38;
    if (i < 2) wheels[i].rotation.y = car.steer * 1.2;
  }

  const camPos = new THREE.Vector3(car.pos.x - dir.x * 9.5, car.pos.y + 4.6, car.pos.z - dir.z * 9.5);
  camera.position.lerp(camPos, 1 - Math.exp(-dt * 3));
  camera.lookAt(car.pos.x + dir.x * 7, car.pos.y + 1.6, car.pos.z + dir.z * 7);

  let best = null, bd = 64;
  for (const b of city.buildings) {
    const dx = Math.max(Math.abs(car.pos.x - b.x) - b.w / 2, 0);
    const dz = Math.max(Math.abs(car.pos.z - b.z) - b.d / 2, 0);
    const d2 = dx * dx + dz * dz;
    if (d2 < bd) { bd = d2; best = b; }
  }
  setCurrent(best);
}

// ---------- inspection card + file viewer ----------
const fmtAge = a => a === 0 ? 'today' : a === 1 ? 'yesterday' : a < 30 ? a + ' days ago' : a < 365 ? Math.round(a / 30) + ' months ago' : (a / 365).toFixed(1) + ' years ago';
const card = document.getElementById('card');
const facesEl = card.querySelector('.faces');
const pathEl = card.querySelector('.path');
const metaEl = card.querySelector('.meta');
let cur = null;
function setCurrent(b) {
  if (b === cur) return;
  if (cur) { buildingsMesh.setColorAt(cur._i, extColor(cur.ext)); buildingsMesh.instanceColor.needsUpdate = true; }
  cur = b;
  if (!b) { card.classList.remove('show'); inspectFace.visible = false; return; }
  buildingsMesh.setColorAt(b._i, extColor(b.ext).multiplyScalar(2.2));
  buildingsMesh.instanceColor.needsUpdate = true;
  if (mode === 'drive') chime();

  facesEl.replaceChildren(...(b.authors ?? []).map(([n, , h]) => {
    const img = document.createElement('img');
    img.title = n;
    img.src = h ? `https://www.gravatar.com/avatar/${h}?s=76&d=404` : face(n).url;
    img.onerror = () => { img.onerror = null; img.src = face(n).url; };
    return img;
  }));
  const parts = b.path.split('/');
  pathEl.innerHTML = parts.slice(0, -1).map(p => p + ' / ').join('') + `<b>${parts.at(-1)}</b>`;
  metaEl.innerHTML = [
    `<em>${b.lines.toLocaleString()}</em> lines`,
    `<em>${(b.bytes / 1024).toFixed(1)}</em> KB`,
    b.commits && `<em>${b.commits}</em> commits${b.commits >= HOT ? ' 🔥' : ''}`,
    b.age != null && `touched <em>${fmtAge(b.age)}</em>`,
    b.authors?.length && b.authors.map(([n, c]) => `${n} ×${c}`).join(', '),
    'press <em>E</em> to read',
  ].filter(Boolean).join(' · ');
  if (b.authors?.length) {
    inspectFace.material.map = face(b.authors[0][0], b.authors[0][2]).tex;
    inspectFace.material.needsUpdate = true;
    inspectFace.visible = true;
  } else inspectFace.visible = false;
}

const viewer = document.getElementById('viewer');
const vpath = document.getElementById('vpath');
const vbody = document.getElementById('vbody');
let viewerOpen = false;
async function openFile(b) {
  vpath.textContent = b.path;
  vbody.textContent = 'loading…';
  viewer.style.display = 'flex';
  viewerOpen = true;
  for (const k of Object.keys(keys)) keys[k] = false;
  try {
    const r = await fetch('/raw?p=' + encodeURIComponent(b.path));
    vbody.textContent = r.ok ? await r.text() : 'could not load — serve with `node server.mjs`';
  } catch { vbody.textContent = 'could not load — serve with `node server.mjs`'; }
}
function closeViewer() { viewer.style.display = 'none'; viewerOpen = false; }
document.getElementById('vclose').onclick = closeViewer;

document.getElementById('repoline').textContent =
  `${city.name} · ${city.buildings.length} files · ${team.map(([n]) => n).join(', ')}`;
setTimeout(() => document.getElementById('brand').classList.add('dim'), 6000);

// ---------- modes ----------
let mode = null;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.maxDistance = 700;
const modeBtn = document.getElementById('modeBtn');
function setMode(mn) {
  mode = mn;
  const drive = mn === 'drive';
  controls.enabled = !drive;
  carGroup.visible = drive;
  modeBtn.textContent = drive ? '🚗' : '🛰';
  if (audio.engineGain && !drive) audio.engineGain.gain.value = 0;
  if (!drive) {
    controls.target.set(car.pos.x, 2, car.pos.z);
    setCurrent(null);
  }
}
modeBtn.onclick = () => setMode(mode === 'drive' ? 'orbit' : 'drive');

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.4, 1.0));
composer.addPass(new OutputPass());

let stats = null;
if (q.has('debug')) {
  const { default: Stats } = await import('three/addons/libs/stats.module.js');
  stats = new Stats();
  stats.dom.style.cssText = 'position:fixed;top:114px;right:10px;';
  document.body.appendChild(stats.dom);
}

function flyTo(b) {
  let dir = new THREE.Vector3().subVectors(camera.position, controls.target).setY(0);
  if (dir.lengthSq() < 1e-4) dir.set(1, 0, 1);
  dir.normalize();
  const dist = Math.max(25, b.h * 2.2, Math.max(b.w, b.d) * 4);
  const pos = new THREE.Vector3(b.x, 0, b.z).addScaledVector(dir, dist).setY(Math.max(18, b.h * 1.6));
  controls.enabled = false;
  gsap.to(camera.position, { x: pos.x, y: pos.y, z: pos.z, duration: 1.4, ease: 'power3.inOut' });
  gsap.to(controls.target, {
    x: b.x, y: baseY(b) + b.h / 2, z: b.z, duration: 1.4, ease: 'power3.inOut',
    onComplete: () => { controls.enabled = true; },
  });
}
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
const pick = e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  return ray.intersectObject(buildingsMesh)[0];
};
addEventListener('pointermove', e => {
  if (mode !== 'orbit' || viewerOpen || e.target !== renderer.domElement) return;
  const hit = pick(e);
  setCurrent(hit ? city.buildings[hit.instanceId] : null);
});
let down = null;
addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
addEventListener('pointerup', e => {
  if (mode !== 'orbit' || viewerOpen || e.target !== renderer.domElement) return;
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const hit = pick(e);
  if (hit) flyTo(city.buildings[hit.instanceId]);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

if (q.has('shot')) { setMode('orbit'); camera.position.set(150, 120, 150); controls.target.set(0, 0, 0); }
else setMode('drive');

const clock = new THREE.Clock();
let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  if (mode === 'drive' && !viewerOpen) driveStep(dt); else controls.update();
  beaconMat.emissiveIntensity = 2.4 + Math.sin(t * 2) * 0.5;
  for (const r of residents) r.s.position.set(r.b.x, baseY(r.b) + r.b.h + 3.6 + Math.sin(t * 1.6 + r.ph) * 0.35, r.b.z);
  for (const s of gate) s.s.position.y = s.y0 + Math.sin(t * 1.3 + s.ph) * 0.3;
  if (cur && inspectFace.visible) inspectFace.position.set(cur.x, baseY(cur) + cur.h + 3, cur.z);
  if (audio.ctx) {
    const v = Math.abs(car.speed);
    audio.osc.frequency.value = 46 + v * 2.4;
    audio.osc2.frequency.value = 92 + v * 4.8;
    audio.engineGain.gain.value = (mode === 'drive' && !viewerOpen && !audio.muted) ? Math.min(0.05, 0.008 + v * 0.0011) : 0;
  }
  if (q.has('nobloom')) renderer.render(scene, camera); else composer.render();
  stats?.update();
});
</script>
</body>
</html>
